[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file2md"
version = "0.1.0"
description = "Convert PDF, DOCX, PPTX, XLSX, and images to lightweight Markdown"
requires-python = ">=3.9"
dependencies = [
    "PyMuPDF>=1.23.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]

[project.scripts]
file2md = "file2md.cli:main"
